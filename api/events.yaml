asyncapi: 2.6.0
info:
  title: Search Engine Events
  version: 0.1.0
  description: |
    Choreography contract between the services. Every event is published to an ActiveMQ virtual topic
    (VirtualTopic.<Event>). Each consuming service reads its own queue Consumer.<group>.VirtualTopic.<Event>,
    so every service gets one copy of each event and the replicas of a service share that copy.

    Work sharing: each consumer reserves one message at a time (QUEUE_PREFETCH, default 1), so the replicas and
    worker threads of a service share the queue evenly, including replicas that connect after the events were
    published.

    Payloads are JSON text messages with snake_case fields, sent as persistent messages.

    Acknowledgement: consumers use transacted sessions. The message is acknowledged only after the handler
    finishes, together with the events the handler published. If the handler fails, the transaction is rolled
    back: its published events are discarded and the message is redelivered.

    Retries: up to MAX_REDELIVERIES (default 5) redeliveries. The delay starts at REDELIVERY_DELAY_MS
    (default 1000 ms) and doubles on every retry (1, 2, 4, 8 and 16 s by default). While a message waits for
    its redelivery, the consumer keeps processing the next messages. After the last retry the message is moved
    to the dead-letter queue ActiveMQ.DLQ.

    Duplicates: delivery is at least once, so every handler must be idempotent (draft rules per channel below).

    Ordering: no ordering is assumed between different books.
servers:
  local:
    url: tcp://localhost:61616
    protocol: jms
    description: ActiveMQ Classic broker on the Stage 2 host
channels:
  VirtualTopic.BookRequested:
    description: |
      A book should be ingested. Producer: feeder. Consumer group: ingestion (queue Consumer.ingestion.VirtualTopic.BookRequested).
      Duplicates: a book already stored in the datalake is not downloaded again; BookDownloaded is published again.
    subscribe:
      operationId: onBookRequested
      message: {$ref: '#/components/messages/BookRequested'}
  VirtualTopic.BookDownloaded:
    description: |
      Header and body of a book are completely written in the datalake. Producer: ingestion.
      Consumer group: indexing (queue Consumer.indexing.VirtualTopic.BookDownloaded).
      Processing: indexing stores the metadata with status "indexing", adds the book to the postings of its terms,
      sets the status to "published" and then publishes BookIndexed. Search only returns published books.
      Duplicates: a book that is already published is not indexed again; BookIndexed is published again.
      Two copies processed at the same time do not duplicate postings or metadata (upserts and $addToSet).
      Failures: if the book files cannot be read or MongoDB fails, the event is rolled back and redelivered;
      postings written before the failure are not visible to search because the book is not published yet.
    subscribe:
      operationId: onBookDownloaded
      message: {$ref: '#/components/messages/BookDownloaded'}
  VirtualTopic.BookIndexed:
    description: |
      The index update of a book is published and visible to search. Producer: indexing. No consumer group yet.
      Not published for the books processed by an index rebuild.
    subscribe:
      operationId: onBookIndexed
      message: {$ref: '#/components/messages/BookIndexed'}
  VirtualTopic.IndexRebuildRequested:
    description: |
      The index must be rebuilt from every book in the datalake. Producer: feeder.
      Consumer group: indexing (queue Consumer.indexing.VirtualTopic.IndexRebuildRequested).
      Processing: the index and the metadata are built in the staging collections inverted_index_rebuild and
      books_rebuild, which then replace inverted_index and books. Search keeps reading the previous index until
      the replacement. Books stored in the datalake during the rebuild are indexed afterwards.
      Failures: the event is redelivered and the rebuild starts again from empty staging collections;
      the previous index stays in use.
    subscribe:
      operationId: onIndexRebuildRequested
      message: {$ref: '#/components/messages/IndexRebuildRequested'}
components:
  messages:
    BookRequested:
      contentType: application/json
      payload:
        type: object
        required: [book_id]
        properties:
          book_id: {type: integer, example: 11}
    BookDownloaded:
      contentType: application/json
      payload:
        type: object
        required: [book_id, path]
        properties:
          book_id: {type: integer, example: 11}
          path:
            type: string
            description: Folder of the book relative to the datalake root (DATALAKE_PATH)
            example: 20261028/10
    BookIndexed:
      contentType: application/json
      payload:
        type: object
        required: [book_id]
        properties:
          book_id: {type: integer, example: 11}
    IndexRebuildRequested:
      contentType: application/json
      payload:
        type: object
