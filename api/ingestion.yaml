openapi: 3.0.3
info:
  title: Ingestion Service API
  version: 0.2.0
  description: >-
    Operational, read-only API. Ingestion work is triggered by BookRequested events (see events.yaml),
    not by HTTP. Draft; routes return 501 until they are implemented.
servers:
  - url: http://localhost:7001
tags:
  - name: operational
    description: Status queries and health checks
paths:
  /ingest/status/{book_id}:
    get:
      tags: [operational]
      summary: Whether a book is in the datalake
      parameters:
        - {name: book_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Ingestion status
          content:
            application/json:
              schema:
                type: object
                properties:
                  book_id: {type: integer}
                  status: {type: string, enum: [available, missing]}
        '400': {$ref: '#/components/responses/BadRequest'}
  /ingest/list:
    get:
      tags: [operational]
      summary: Books stored in the datalake
      responses:
        '200':
          description: Book ids
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: {type: integer}
                  books: {type: array, items: {type: integer}}
  /status:
    get:
      tags: [operational]
      summary: Health check
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
components:
  schemas:
    Status:
      type: object
      properties:
        service: {type: string}
        status: {type: string, example: running}
    ApiError:
      type: object
      properties:
        error: {type: string}
        message: {type: string}
  responses:
    BadRequest:
      description: Invalid parameters
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
