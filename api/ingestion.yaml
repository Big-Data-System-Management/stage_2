openapi: 3.0.3
info:
  title: Ingestion Service API
  version: 1.0.0
  description: |
    Operational API. Provider: ingestion-service. Consumers: operators and the validation scripts.
    Neither the front-end nor the other services call it.

    Ingestion work is triggered by BookRequested events (see events.yaml), not by HTTP, so there is no
    POST /ingest/{book_id}. Every operation is read-only, idempotent and safe to retry.
servers:
  - url: http://localhost:7001
tags:
  - name: operational
    description: Status queries and health checks, consumed by operators and scripts
paths:
  /ingest/status/{book_id}:
    get:
      tags: [operational]
      summary: Whether a book is in the datalake
      description: A book is available only when its header and body files are both complete.
      parameters:
        - name: book_id
          in: path
          required: true
          description: Positive book identifier
          schema: {type: integer, minimum: 1}
          example: 11
      responses:
        '200':
          description: Ingestion status; a book that is not stored is reported as missing
          content:
            application/json:
              schema:
                type: object
                required: [book_id, status]
                properties:
                  book_id: {type: integer}
                  status: {type: string, enum: [available, missing]}
              examples:
                available:
                  summary: GET /ingest/status/11
                  value: {book_id: 11, status: available}
                missing:
                  summary: GET /ingest/status/999999
                  value: {book_id: 999999, status: missing}
        '400':
          description: '`book_id` is not a positive integer'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
              example: {error: bad_request, message: book_id must be a positive integer}
  /ingest/list:
    get:
      tags: [operational]
      summary: Books stored in the datalake
      description: Complete books in ascending order of identifier. It checks the datalake folders on every call.
      responses:
        '200':
          description: Book identifiers
          content:
            application/json:
              schema:
                type: object
                required: [count, books]
                properties:
                  count: {type: integer}
                  books: {type: array, items: {type: integer}}
              example: {count: 3, books: [11, 12, 74750]}
  /status:
    get:
      tags: [operational]
      summary: Health check
      description: Reports that the process is running; it does not check the broker.
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
              example: {service: ingestion-service, status: running}
components:
  schemas:
    Status:
      type: object
      properties:
        service: {type: string}
        status: {type: string, example: running}
    ApiError:
      type: object
      required: [error, message]
      properties:
        error: {type: string, enum: [bad_request]}
        message: {type: string}
