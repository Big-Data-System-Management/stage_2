openapi: 3.0.3
info:
  title: Search Service API
  version: 0.1.0
  description: Front-end facing API. Draft; routes return 501 until they are implemented.
servers:
  - url: http://localhost:7003
tags:
  - name: front-end
    description: Consumed by the front-end
  - name: operational
    description: Health checks
paths:
  /search:
    get:
      tags: [front-end]
      summary: Keyword search with optional filters
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1}}
        - {name: author, in: query, schema: {type: string}}
        - {name: language, in: query, schema: {type: string}}
        - {name: year, in: query, schema: {type: integer}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Page of results; an empty list when nothing matches
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /search/filters:
    get:
      tags: [front-end]
      summary: Available filter values
      responses:
        '200':
          description: Filter values
          content:
            application/json:
              schema:
                type: object
                properties:
                  languages: {type: array, items: {type: string}}
                  years: {type: array, items: {type: integer}}
  /books/{book_id}:
    get:
      tags: [front-end]
      summary: Metadata of one book
      parameters:
        - {name: book_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Book metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookMetadata'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /status:
    get:
      tags: [operational]
      summary: Health check
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
components:
  schemas:
    BookMetadata:
      type: object
      properties:
        book_id: {type: integer}
        title: {type: string}
        author: {type: string}
        language: {type: string}
        year: {type: integer, nullable: true}
    SearchResponse:
      type: object
      properties:
        query: {type: string}
        filters: {type: object, additionalProperties: true}
        total: {type: integer}
        offset: {type: integer}
        limit: {type: integer}
        results: {type: array, items: {$ref: '#/components/schemas/BookMetadata'}}
    Status:
      type: object
      properties:
        service: {type: string}
        status: {type: string, example: running}
    ApiError:
      type: object
      properties:
        error: {type: string}
        message: {type: string}
  responses:
    BadRequest:
      description: Invalid parameters
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: Book not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
